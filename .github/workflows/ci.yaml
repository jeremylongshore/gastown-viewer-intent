name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Ensure web_dist stub for go:embed
        run: mkdir -p internal/api/web_dist && test -f internal/api/web_dist/index.html || echo '<!DOCTYPE html><html><body>stub</body></html>' > internal/api/web_dist/index.html

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Ensure web_dist stub for go:embed
        run: mkdir -p internal/api/web_dist && test -f internal/api/web_dist/index.html || echo '<!DOCTYPE html><html><body>stub</body></html>' > internal/api/web_dist/index.html

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
