name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Ensure web_dist stub for go:embed
        run: mkdir -p internal/api/web_dist && test -f internal/api/web_dist/index.html || echo '<!DOCTYPE html><html><body>stub</body></html>' > internal/api/web_dist/index.html

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Ensure web_dist stub for go:embed
        run: mkdir -p internal/api/web_dist && test -f internal/api/web_dist/index.html || echo '<!DOCTYPE html><html><body>stub</body></html>' > internal/api/web_dist/index.html

      # golangci-lint v2 through the official action (v9 is its first node24 release). The
      # linter version is pinned so a new release cannot turn an untouched branch red;
      # configuration lives in .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
