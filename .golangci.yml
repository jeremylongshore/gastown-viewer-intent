# golangci-lint v2 configuration. The defaults are kept; one quick-fix rule is off.
version: "2"
linters:
  settings:
    staticcheck:
      checks:
        # golangci-lint's own default set ...
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ... minus QF1001 (De Morgan). `!(isLetter || isDigit)` reads as the sentence it
        # is; the suggested `!isLetter && !isDigit` over inverted range comparisons does not.
        - -QF1001
